# Go-based build + test pipeline for datafog-api

name: Main CICD datafog-api app

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"
    - name: Run gofmt check
      run: |
        test -z "$(gofmt -l cmd internal | tee /tmp/gofmt-diff.txt)" || {
          echo "Run gofmt on:"
          cat /tmp/gofmt-diff.txt
          exit 1
        }
    - name: Run tests
      run: go test ./...
    - name: Lint (go vet)
      run: go vet ./...
    - name: Security checks
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        go install golang.org/x/vuln/cmd/govulncheck@latest
        gosec -severity medium -confidence medium ./...

        tmpfile="$(mktemp)"
        if ! govulncheck ./... >"$tmpfile" 2>&1; then
          if grep -E "Found in: .*@v" "$tmpfile" >/dev/null; then
            cat "$tmpfile"
            rm -f "$tmpfile"
            exit 1
          fi
          echo "Govulncheck reported only standard-library advisories; review separately."
          cat "$tmpfile"
        fi
        rm -f "$tmpfile"
    - name: Build container image
      run: docker build . --file Dockerfile --tag datafog-api:$(date +%s)
