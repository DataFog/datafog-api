<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataFog — Scenario Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.6}

/* Fixed header */
.header{position:sticky;top:0;z-index:100;background:#1e293b;border-bottom:1px solid #334155;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600;color:#f8fafc}
.header h1 span{color:#38bdf8}
.header-right{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.status .dot{width:7px;height:7px;border-radius:50%;background:#ef4444}
.status .dot.ok{background:#22c55e}
button.reset-btn{padding:6px 14px;border-radius:6px;border:1px solid #475569;background:#334155;color:#e2e8f0;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
button.reset-btn:hover{background:#475569;border-color:#64748b}

.container{max-width:800px;margin:0 auto;padding:32px 24px}

/* Scenario picker */
.picker{display:flex;flex-direction:column;gap:12px}
.picker h2{font-size:22px;font-weight:600;color:#f8fafc;margin-bottom:4px}
.picker p{color:#94a3b8;font-size:14px;margin-bottom:12px}
.scenario-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 20px;cursor:pointer;transition:all .15s}
.scenario-card:hover{border-color:#38bdf8;background:#1e293b}
.scenario-card h3{font-size:15px;font-weight:600;color:#f8fafc;margin-bottom:4px}
.scenario-card p{font-size:13px;color:#94a3b8;margin:0}
.scenario-card .tags{display:flex;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-deny{background:#2d0a0a;color:#f87171}
.tag-redact{background:#172538;color:#38bdf8}
.tag-allow{background:#052e16;color:#22c55e}
.tag-entity{background:#1e3a5f;color:#93c5fd}

/* Step timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.step{border-left:2px solid #334155;padding:0 0 0 24px;margin-left:12px;position:relative;opacity:0;transform:translateY(12px);transition:all .4s ease}
.step.visible{opacity:1;transform:translateY(0)}
.step::before{content:'';position:absolute;left:-7px;top:24px;width:12px;height:12px;border-radius:50%;background:#334155;border:2px solid #0f172a;transition:background .3s}
.step.active::before{background:#38bdf8}
.step.done::before{background:#22c55e}
.step.error-state::before{background:#ef4444}
.step-content{padding:16px 0 32px 0}
.step-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.step-title{font-size:15px;font-weight:600;color:#f8fafc;margin-bottom:8px}
.step-desc{font-size:13px;color:#94a3b8;margin-bottom:12px}
.step-result{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;font-size:13px}
.step-result pre{font-family:'Cascadia Code',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#e2e8f0;margin:0}

/* Decision badges */
.decision-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.decision-allow{background:#052e16;color:#22c55e;border:1px solid #166534}
.decision-deny{background:#2d0a0a;color:#ef4444;border:1px solid #7f1d1d}
.decision-allow_with_redaction{background:#172538;color:#38bdf8;border:1px solid #1e3a5f}

.finding-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0f172a;border-radius:6px;margin-bottom:4px}
.finding-type{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;background:#1e3a5f;color:#38bdf8}
.finding-val{font-family:monospace;font-size:12px;color:#f8fafc}
.finding-conf{font-size:11px;color:#64748b;margin-left:auto}

.rule-tag{display:inline-block;padding:2px 8px;background:#312e81;color:#a5b4fc;border-radius:4px;font-size:11px;margin-right:4px;font-family:monospace}

.diff-line{font-family:monospace;font-size:12px;line-height:1.8}
.diff-removed{background:#5c1a1a;color:#fca5a5;text-decoration:line-through;padding:1px 3px;border-radius:2px}
.diff-added{background:#14532d;color:#86efac;padding:1px 3px;border-radius:2px}

.meta-row{font-size:12px;color:#94a3b8;margin-top:8px}
.meta-row span{margin-right:12px}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.next-btn{padding:8px 18px;border-radius:6px;border:1px solid #2563eb;background:#2563eb;color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-top:4px}
.next-btn:hover{background:#1d4ed8}
.next-btn:disabled{opacity:.4;cursor:not-allowed}

.scenario-header{margin-bottom:24px}
.scenario-header h2{font-size:20px;font-weight:600;color:#f8fafc}
.scenario-header p{font-size:13px;color:#94a3b8;margin-top:4px}

.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="header">
  <h1><span>DataFog</span> Scenario Explorer</h1>
  <div class="header-right">
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Connecting...</span></div>
    <button class="reset-btn" id="resetBtn" onclick="reset()" style="display:none">Start Over</button>
  </div>
</div>

<div class="container" id="app"></div>

<script>
const API = window.location.origin || 'http://localhost:8080';

// ─── Scenario definitions ────────────────────────────────────
const SCENARIOS = [
  {
    id: 'shell-api-key',
    title: 'Agent leaks API key in shell command',
    desc: 'An AI agent tries to run a git push, but the text it passes contains an API secret. The shim detects the key and blocks execution.',
    tags: [['deny','deny'], ['entity','api_key']],
    steps: [
      {
        label: 'Step 1',
        title: 'Agent prepares shell command',
        desc: 'The agent wants to run a git push. The context includes an API key from a config file.',
        type: 'info',
        display: { command: 'git push origin main', context: 'Deploying with api_key=SK8xPw2mQ9nR4vT7yBcD3fGh to production' }
      },
      {
        label: 'Step 2',
        title: 'DataFog scans for PII',
        desc: 'The shim sends the payload to the scan engine before making a policy decision.',
        type: 'scan',
        request: { text: 'Deploying with api_key=SK8xPw2mQ9nR4vT7yBcD3fGh to production' }
      },
      {
        label: 'Step 3',
        title: 'Policy engine evaluates',
        desc: 'Rule deny-shell-api-key matches: shell action + api_key entity detected.',
        type: 'decide',
        request: { action: { type: 'shell.exec', command: 'git', args: ['push','origin','main'] }, text: 'Deploying with api_key=SK8xPw2mQ9nR4vT7yBcD3fGh to production' }
      },
      {
        label: 'Step 4',
        title: 'Shim blocks execution',
        desc: 'The command never runs. The agent receives a deny response with the matched rule.',
        type: 'exec',
        request: { command: 'git', args: ['push','origin','main'], stdin: 'Deploying with api_key=SK8xPw2mQ9nR4vT7yBcD3fGh to production' }
      }
    ]
  },
  {
    id: 'file-write-redact',
    title: 'File write with PII gets redacted',
    desc: 'An agent writes a log file containing emails and SSNs. The shim detects PII and redacts it before the file hits disk.',
    tags: [['redact','allow_with_redaction'], ['entity','email'], ['entity','ssn']],
    steps: [
      {
        label: 'Step 1',
        title: 'Agent prepares file write',
        desc: 'The agent wants to write a summary file. The content contains customer PII.',
        type: 'info',
        display: { filename: 'summary.txt', content: 'Customer: alice@example.com\nSSN: 123-45-6789\nPhone: 555-123-4567\nStatus: Active' }
      },
      {
        label: 'Step 2',
        title: 'DataFog scans content',
        desc: 'Before writing, the shim scans the file content for sensitive entities.',
        type: 'scan',
        request: { text: 'Customer: alice@example.com\nSSN: 123-45-6789\nPhone: 555-123-4567\nStatus: Active' }
      },
      {
        label: 'Step 3',
        title: 'Policy engine decides: redact',
        desc: 'Rule redact-file-write matches. Decision: allow with redaction — PII will be stripped before writing.',
        type: 'decide',
        request: { action: { type: 'file.write', resource: 'summary.txt' }, text: 'Customer: alice@example.com\nSSN: 123-45-6789\nPhone: 555-123-4567\nStatus: Active' }
      },
      {
        label: 'Step 4',
        title: 'File written with redactions',
        desc: 'The shim writes the file, but PII has been replaced. Compare original vs what hit disk.',
        type: 'write',
        request: { filename: 'summary.txt', content: 'Customer: alice@example.com\nSSN: 123-45-6789\nPhone: 555-123-4567\nStatus: Active' }
      }
    ]
  },
  {
    id: 'safe-command',
    title: 'Clean command passes through',
    desc: 'An agent runs a safe command with no PII. The shim allows it and returns the output.',
    tags: [['allow','allow']],
    steps: [
      {
        label: 'Step 1',
        title: 'Agent prepares command',
        desc: 'A simple echo with no sensitive data.',
        type: 'info',
        display: { command: 'echo', args: 'Hello from DataFog' }
      },
      {
        label: 'Step 2',
        title: 'DataFog scans context',
        desc: 'The shim scans the command context. No PII found.',
        type: 'scan',
        request: { text: 'echo Hello from DataFog' }
      },
      {
        label: 'Step 3',
        title: 'Policy engine allows',
        desc: 'No deny rules match. The allow-shell fallback rule grants execution.',
        type: 'decide',
        request: { action: { type: 'shell.exec', command: 'echo', args: ['Hello','from','DataFog'] }, text: 'echo Hello from DataFog' }
      },
      {
        label: 'Step 4',
        title: 'Command executes successfully',
        desc: 'The command runs and output is returned to the agent.',
        type: 'exec',
        request: { command: 'echo', args: ['Hello','from','DataFog'] }
      }
    ]
  },
  {
    id: 'file-read-redact',
    title: 'Reading a file redacts PII in output',
    desc: 'A file on disk has PII. When the agent reads it through the shim, sensitive values are redacted in the returned content.',
    tags: [['redact','allow_with_redaction'], ['entity','email'], ['entity','phone']],
    steps: [
      {
        label: 'Step 1',
        title: 'Seed a file with PII',
        desc: 'First, we write a raw file to the sandbox (bypassing the shim) so there is PII on disk to read back.',
        type: 'seed',
        request: { filename: 'contacts.txt', content: 'Bob: bob@corp.io / 415-555-0199\nInternal key: api_key=Abc1234567890123456' }
      },
      {
        label: 'Step 2',
        title: 'Agent requests file read',
        desc: 'The agent asks the shim to read contacts.txt.',
        type: 'info',
        display: { filename: 'contacts.txt', action: 'file.read' }
      },
      {
        label: 'Step 3',
        title: 'Policy engine decides: redact',
        desc: 'Rule redact-file-read matches. The file content will be scanned and PII redacted before returning to the agent.',
        type: 'decide',
        request: { action: { type: 'file.read', resource: 'contacts.txt' }, text: 'Bob: bob@corp.io / 415-555-0199\nInternal key: api_key=Abc1234567890123456' }
      },
      {
        label: 'Step 4',
        title: 'Agent receives redacted content',
        desc: 'The raw file is intact on disk, but the agent only sees the sanitized version.',
        type: 'read',
        request: { filename: 'contacts.txt' }
      }
    ]
  }
];

// ─── State ───────────────────────────────────────────────────
let currentScenario = null;
let currentStep = 0;
let stepResults = [];
let running = false;

// ─── API helpers ─────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function apiCall(method, path, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const t0 = performance.now();
  const res = await fetch(API + path, opts);
  const ms = Math.round(performance.now() - t0);
  const data = await res.json();
  return { data, ms, ok: res.ok };
}

// ─── Render: scenario picker ─────────────────────────────────
function renderPicker() {
  const app = document.getElementById('app');
  document.getElementById('resetBtn').style.display = 'none';
  let html = `<div class="picker fade-in">
    <h2>Choose a scenario</h2>
    <p>Each scenario walks through the full DataFog enforcement pipeline step by step.</p>`;
  SCENARIOS.forEach((s, i) => {
    const tags = s.tags.map(([label, cls]) => {
      const tagCls = cls === 'deny' ? 'tag-deny' : cls === 'allow' ? 'tag-allow' : cls === 'allow_with_redaction' ? 'tag-redact' : 'tag-entity';
      return `<span class="tag ${tagCls}">${esc(label)}</span>`;
    }).join('');
    html += `<div class="scenario-card" onclick="selectScenario(${i})">
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
      <div class="tags">${tags}</div>
    </div>`;
  });
  html += '</div>';
  app.innerHTML = html;
}

// ─── Render: scenario timeline ───────────────────────────────
function renderTimeline() {
  const s = SCENARIOS[currentScenario];
  const app = document.getElementById('app');
  document.getElementById('resetBtn').style.display = '';

  let html = `<div class="scenario-header fade-in">
    <h2>${esc(s.title)}</h2>
    <p>${esc(s.desc)}</p>
  </div>
  <div class="timeline" id="timeline">`;

  s.steps.forEach((step, i) => {
    const vis = i <= currentStep ? 'visible' : '';
    const state = i < currentStep ? 'done' : i === currentStep ? 'active' : '';
    html += `<div class="step ${vis} ${state}" id="step-${i}">
      <div class="step-content">
        <div class="step-label">${esc(step.label)}</div>
        <div class="step-title">${esc(step.title)}</div>
        <div class="step-desc">${esc(step.desc)}</div>
        <div id="step-result-${i}"></div>
      </div>
    </div>`;
  });

  html += '</div>';
  html += `<div id="step-actions" style="margin-top:8px;margin-left:36px"></div>`;
  app.innerHTML = html;

  // Render any already-computed results
  for (let i = 0; i < stepResults.length; i++) {
    if (stepResults[i]) document.getElementById(`step-result-${i}`).innerHTML = stepResults[i];
  }

  updateActions();
}

function updateActions() {
  const s = SCENARIOS[currentScenario];
  const el = document.getElementById('step-actions');
  if (!el) return;

  if (currentStep >= s.steps.length) {
    el.innerHTML = `<button class="next-btn" onclick="rerunScenario()">Run Again</button>`;
    return;
  }

  const step = s.steps[currentStep];
  const isInfo = step.type === 'info';
  const label = currentStep === 0 ? 'Begin' : 'Next Step';

  if (running) {
    el.innerHTML = `<button class="next-btn" disabled><span class="spinner"></span>Running...</button>`;
  } else {
    el.innerHTML = `<button class="next-btn" onclick="advanceStep()">${label}</button>`;
  }
}

// ─── Step execution ──────────────────────────────────────────
async function advanceStep() {
  if (running) return;
  const s = SCENARIOS[currentScenario];
  if (currentStep >= s.steps.length) return;

  const step = s.steps[currentStep];
  running = true;
  updateActions();

  // Make step visible and active
  const stepEl = document.getElementById(`step-${currentStep}`);
  if (stepEl) { stepEl.classList.add('visible', 'active'); }

  let resultHTML = '';

  try {
    switch (step.type) {
      case 'info':
        resultHTML = renderInfoResult(step.display);
        break;
      case 'scan':
        resultHTML = await runScanStep(step.request);
        break;
      case 'decide':
        resultHTML = await runDecideStep(step.request);
        break;
      case 'exec':
        resultHTML = await runExecStep(step.request);
        break;
      case 'write':
        resultHTML = await runWriteStep(step.request);
        break;
      case 'read':
        resultHTML = await runReadStep(step.request);
        break;
      case 'seed':
        resultHTML = await runSeedStep(step.request);
        break;
    }
  } catch (e) {
    resultHTML = `<div class="step-result"><pre style="color:#f87171">${esc(e.message || String(e))}</pre></div>`;
  }

  stepResults[currentStep] = resultHTML;
  const resultEl = document.getElementById(`step-result-${currentStep}`);
  if (resultEl) resultEl.innerHTML = resultHTML;

  // Mark done, advance
  if (stepEl) { stepEl.classList.remove('active'); stepEl.classList.add('done'); }

  const isError = step.type === 'exec' && stepResults[currentStep]?.includes('decision-deny');
  if (isError && stepEl) { stepEl.classList.add('error-state'); }

  currentStep++;
  running = false;

  // Reveal next step if exists
  if (currentStep < s.steps.length) {
    const nextEl = document.getElementById(`step-${currentStep}`);
    if (nextEl) {
      setTimeout(() => { nextEl.classList.add('visible', 'active'); }, 200);
    }
  }

  updateActions();
}

// ─── Step renderers ──────────────────────────────────────────
function renderInfoResult(display) {
  let rows = '';
  for (const [k, v] of Object.entries(display)) {
    rows += `<div style="margin-bottom:6px"><span style="color:#64748b;font-size:11px;text-transform:uppercase">${esc(k)}</span><pre style="margin-top:2px">${esc(v)}</pre></div>`;
  }
  return `<div class="step-result">${rows}</div>`;
}

async function runScanStep(req) {
  const { data, ms } = await apiCall('POST', '/v1/scan', req);
  const findings = data.findings || [];
  if (findings.length === 0) {
    return `<div class="step-result"><div style="color:#94a3b8">No PII detected</div><div class="meta-row"><span>${ms}ms</span></div></div>`;
  }
  let html = '<div class="step-result">';
  findings.forEach(f => {
    html += `<div class="finding-row">
      <span class="finding-type">${esc(f.entity_type)}</span>
      <span class="finding-val">${esc(f.value)}</span>
      <span class="finding-conf">${(f.confidence * 100).toFixed(0)}%</span>
    </div>`;
  });
  html += `<div class="meta-row"><span>${findings.length} entities</span><span>${ms}ms</span></div></div>`;
  return html;
}

async function runDecideStep(req) {
  const { data, ms } = await apiCall('POST', '/v1/decide', req);
  const d = data.decision || 'unknown';
  const cls = d === 'allow' ? 'decision-allow' : d === 'deny' ? 'decision-deny' : 'decision-allow_with_redaction';

  let html = `<div class="step-result">
    <span class="decision-badge ${cls}">${esc(d.replace(/_/g, ' '))}</span>`;

  if (data.reason) html += `<div class="meta-row" style="margin-top:8px"><strong>Reason:</strong> ${esc(data.reason)}</div>`;
  if (data.matched_rules?.length) html += `<div class="meta-row">Rules: ${data.matched_rules.map(r => `<span class="rule-tag">${esc(r)}</span>`).join('')}</div>`;
  if (data.transform_plan?.length) {
    html += `<div class="meta-row">Transform: ${data.transform_plan.map(s => `<span class="finding-type" style="margin-right:4px">${esc(s.entity_type)} → ${esc(s.mode)}</span>`).join('')}</div>`;
  }
  html += `<div class="meta-row"><span>Receipt: <code style="color:#64748b">${data.receipt_id || 'n/a'}</code></span><span>${ms}ms</span></div></div>`;
  return html;
}

async function runExecStep(req) {
  const { data, ms } = await apiCall('POST', '/demo/exec', req);
  const d = data.decision?.decision || 'unknown';
  const cls = d === 'allow' ? 'decision-allow' : d === 'deny' ? 'decision-deny' : 'decision-allow_with_redaction';
  let html = `<div class="step-result"><span class="decision-badge ${cls}">${esc(d.replace(/_/g,' '))}</span>`;

  if (data.blocked) {
    html += `<div style="margin-top:10px;color:#f87171;font-size:13px"><strong>Blocked</strong> — command was never executed</div>`;
    if (data.decision?.matched_rules?.length) html += `<div class="meta-row">Rules: ${data.decision.matched_rules.map(r => `<span class="rule-tag">${esc(r)}</span>`).join('')}</div>`;
  } else if (data.stdout !== undefined) {
    html += `<div style="margin-top:10px"><span style="color:#94a3b8;font-size:11px;text-transform:uppercase">output</span><pre style="margin-top:4px;background:#0f172a;padding:10px;border-radius:6px">${esc(data.stdout)}</pre></div>`;
  }
  html += `<div class="meta-row"><span>${ms}ms</span></div></div>`;
  return html;
}

async function runWriteStep(req) {
  const { data, ms } = await apiCall('POST', '/demo/write-file', req);
  const d = data.decision?.decision || 'unknown';
  const cls = d === 'allow' ? 'decision-allow' : d === 'deny' ? 'decision-deny' : 'decision-allow_with_redaction';

  let html = `<div class="step-result">`;

  if (data.blocked) {
    html += `<span class="decision-badge decision-deny">denied</span>`;
    html += `<div style="margin-top:8px;color:#f87171">${esc(data.error)}</div>`;
  } else {
    html += `<span class="decision-badge ${cls}">${esc(d.replace(/_/g,' '))}</span>`;

    // Show diff between original and written
    const original = req.content;
    const written = data.content || '';
    if (original !== written) {
      html += `<div style="margin-top:12px">
        <div style="margin-bottom:8px"><span style="color:#94a3b8;font-size:11px;text-transform:uppercase">original</span>
          <pre style="margin-top:4px;background:#0f172a;padding:10px;border-radius:6px">${esc(original)}</pre></div>
        <div><span style="color:#22c55e;font-size:11px;text-transform:uppercase">written to disk (redacted)</span>
          <pre style="margin-top:4px;background:#0f172a;padding:10px;border-radius:6px;border:1px solid #166534">${esc(written)}</pre></div>
      </div>`;
    } else {
      html += `<pre style="margin-top:8px;background:#0f172a;padding:10px;border-radius:6px">${esc(written)}</pre>`;
    }
  }
  html += `<div class="meta-row"><span>${ms}ms</span></div></div>`;
  return html;
}

async function runReadStep(req) {
  const { data, ms } = await apiCall('POST', '/demo/read-file', req);
  const d = data.decision?.decision || 'unknown';
  const cls = d === 'allow' ? 'decision-allow' : d === 'deny' ? 'decision-deny' : 'decision-allow_with_redaction';
  let html = `<div class="step-result"><span class="decision-badge ${cls}">${esc(d.replace(/_/g,' '))}</span>`;

  if (data.blocked) {
    html += `<div style="margin-top:8px;color:#f87171">${esc(data.error)}</div>`;
  } else {
    html += `<div style="margin-top:12px"><span style="color:#94a3b8;font-size:11px;text-transform:uppercase">content returned to agent</span>
      <pre style="margin-top:4px;background:#0f172a;padding:10px;border-radius:6px">${esc(data.content)}</pre></div>`;
  }
  html += `<div class="meta-row"><span>${ms}ms</span></div></div>`;
  return html;
}

async function runSeedStep(req) {
  // Write directly to sandbox, bypassing the shim gate — raw PII lands on disk
  const { data, ms } = await apiCall('POST', '/demo/seed', req);
  if (data.seeded) {
    return `<div class="step-result"><div style="color:#22c55e;font-size:13px">File <code>${esc(req.filename)}</code> seeded in sandbox <span style="color:#64748b">(bypassed shim — raw PII on disk)</span></div>
      <pre style="margin-top:6px;background:#0f172a;padding:10px;border-radius:6px;font-size:12px">${esc(req.content)}</pre>
      <div class="meta-row"><span>${ms}ms</span></div></div>`;
  }
  return `<div class="step-result"><div style="color:#f87171">Seed failed: ${esc(data?.error?.message || 'unknown')}</div></div>`;
}

// ─── Navigation ──────────────────────────────────────────────
function selectScenario(index) {
  currentScenario = index;
  currentStep = 0;
  stepResults = [];
  renderTimeline();
}

function rerunScenario() {
  currentStep = 0;
  stepResults = [];
  renderTimeline();
}

function reset() {
  currentScenario = null;
  currentStep = 0;
  stepResults = [];
  running = false;
  renderPicker();
}

// ─── Boot ────────────────────────────────────────────────────
async function boot() {
  try {
    const { data } = await apiCall('GET', '/health');
    document.getElementById('statusDot').classList.add('ok');
    document.getElementById('statusText').textContent = `${data.policy_id} ${data.policy_version}`;
  } catch (e) {
    document.getElementById('statusText').textContent = 'Server unreachable';
  }
  renderPicker();
}

boot();
</script>
</body>
</html>
